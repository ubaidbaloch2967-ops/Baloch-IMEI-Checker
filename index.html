
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMRANI TV</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow-x:hidden;
}
canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
}
.box{position:relative;z-index:2;padding:20px}
h1{
font-size:clamp(45px,12vw,80px);
color:#ff3300;
text-shadow:0 0 20px red,0 0 40px orange;
margin:5px;
}
.tv{
color:#ffcc00;
font-size:45px;
}
.tag{margin:20px}
.btns{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
margin-top:30px;
}
.btn{
padding:13px 23px;
border:2px solid #00eaff;
border-radius:30px;
color:#00eaff;
background:#111;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}
.btn2{border-color:orange;color:orange}
.owner-panel{
display:none;
margin:25px auto;
padding:20px;
max-width:330px;
border:2px solid #ff55e8;
border-radius:20px;
}
.owner-panel.show{display:block}
.owner-photo{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:3px solid cyan;
}
.owner-name{color:#ffcc00}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<main class="box">
<h1>𓆩UM꧊ꝛ͢𓂃aNi𖡼</h1>
<h1 class="tv">TV</h1>

<div class="tag">Open Website and Enjoy TV 🍿🎥</div>

<div class="btns">
<button class="btn" id="owner-button">Website Owner</button>
<a class="btn btn2" href="Movies.html">Show Channels</a>
</div>

<section class="owner-panel" id="owner-panel">
<img class="owner-photo" src="ubaid.jpg" alt="Owner">
<h2 class="owner-name">𓆩❍Ꮿη̽e꧊ꝛ͢𓂃𖡼</h2>
<p>Ubaidullah BaLoch</p>
</section>
</main>

<script>
const button=document.getElementById("owner-button");
const panel=document.getElementById("owner-panel");

button.onclick=()=>{
panel.classList.toggle("show");
};
</script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let stars=[];

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

for(let i=0;i<100;i++){
stars.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
s:Math.random()*1+0.3
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
stars.forEach(p=>{
ctx.fillStyle="#00eaff";
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
p.y+=p.s;
if(p.y>canvas.height)p.y=0;
});
requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
