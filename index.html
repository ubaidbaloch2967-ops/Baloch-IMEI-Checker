<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umrani TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff}

/* ===== INTRO ===== */
#intro{min-height:100dvh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}
#intro h3{font-family:serif;font-size:30px;color:#111;background:#fff;padding:12px 20px;border-radius:14px;line-height:1.4}
#intro h3 small{font-size:18px}
.person{width:230px;margin:15px 0;filter:drop-shadow(0 10px 20px rgba(255,255,255,.2))}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-row button{padding:13px 22px;border-radius:30px;border:none;font-weight:900;cursor:pointer;font-size:15px}
.btn-owner{background:#fff;color:#000}
.btn-show{background:#ff2d55;color:#fff}

/* Owner Popup */
#ownerPop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;padding:20px}
.owner-box{background:#0a0a1a;border:2px solid #ff2d55;border-radius:22px;padding:22px;text-align:center;width:330px;max-width:90vw;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.owner-box img{width:170px;height:170px;object-fit:cover;border-radius:50%;border:3px solid #00e5ff;box-shadow:0 0 25px #00e5ff}
.owner-box h2{color:#ffcc00;margin-top:12px;font-family:serif}
.owner-box p{color:#ccc;margin-top:4px}
.closeOwner{margin-top:14px;background:#ff2d55;border:none;color:#fff;padding:10px 20px;border-radius:12px}

/* Loading */
#loading{display:none;position:fixed;inset:0;background:#000;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:55px;height:55px;border:5px solid #333;border-top:5px solid #ff2d55;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== CHANNELS - PEHLE WALA WAHI CODE ===== */
#channels{display:none;animation:slide .4s ease}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;color:#ff2d55}.logo span{color:#fff}
.support{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:14px}
.hero{padding:25px 15px}.hero h1{font-size:32px;line-height:1.1}.hero h1 span{color:#ff2d55}.hero p{color:#aaa;margin-top:8px}
.search{width:100%;padding:13px;border-radius:12px;border:none;background:#2a2a3d;color:#fff;margin:15px 0;font-size:15px;outline:none}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}.cats button{padding:9px 18px;border-radius:20px;border:none;background:#2a2a3d;color:#fff;white-space:nowrap;cursor:pointer}.cats button.active{background:#ff2d55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}
.card{background:#1e1e32;border-radius:12px;overflow:hidden;cursor:pointer;text-align:center;padding-bottom:10px}
.card img{width:100%;height:90px;object-fit:cover;background:#333}.card p{font-size:13px;margin-top:8px;padding:0 5px}
.live{font-size:10px;background:red;padding:2px 6px;border-radius:10px}
#playerBox{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#playerBox .top{padding:12px;display:flex;justify-content:space-between;align-items:center}
#playerBox button{background:#ff2d55;border:none;color:#fff;padding:8px 14px;border-radius:8px}
video{width:100%;flex:1;background:#000}
canvas#scene{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
<canvas id="scene"></canvas>
<h3>Enjoy our website<br><small>𓆩❍Ꮿη̽e꧊ꝛ͢𓂃𖡼<br>𓆩UM꧊ꝛ͢𓂃aNi𖡼</small></h3>
<img class="person" src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png" alt="Owner">
<div class="btn-row">
<button class="btn-owner" onclick="openOwner()">Website Owner</button>
<button class="btn-show" onclick="goChannels()">Show Channels</button>
</div>
</div>

<!-- OWNER POPUP -->
<div id="ownerPop">
<div class="owner-box">
<img src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png">
<h2>𓆩Owner𓂃𖡼</h2>
<p style="font-size:18px;color:#fff;font-weight:800">Ubaidullah BaLoch</p>
<p>Owner - Umrani TV</p>
<button class="closeOwner" onclick="closeOwner()">Close</button>
</div>
</div>

<!-- LOADING -->
<div id="loading"><div class="spinner"></div><p>Loading Channels...</p></div>

<!-- CHANNELS PAGE - PEHLE WALA -->
<div id="channels">
<header><div class="logo">UMRANI <span>TV</span></div><a class="support" href="https://wa.me/923000000000">Support</a></header>
<div class="hero">
<h1>Watch <span>live</span><br>anywhere.</h1>
<p>● Live now &nbsp; 127 channels</p>
<input class="search" id="search" placeholder="Search channels..." onkeyup="render()">
<div class="cats">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Sports',this)">Sports</button>
<button onclick="filterCat('News',this)">News</button>
<button onclick="filterCat('Entertainment',this)">Entertainment</button>
</div>
</div>
<div class="grid" id="grid"></div>
</div>

<div id="playerBox"><div class="top"><span id="playingName">Playing</span><button onclick="closePlayer()">✕ Close</button></div><video id="video" controls autoplay></video></div>

<script>
// Sakura petals - halki si
const cv=document.getElementById('scene');const cx=cv.getContext('2d');let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<35;i++)pts.push({x:Math.random()*W,y:Math.random()*H,s:5+Math.random()*8,sp:.8+Math.random()*1.5,a:Math.random()*6});
(function loop(){cx.clearRect(0,0,W,H);pts.forEach(p=>{p.y+=p.sp;p.x+=Math.sin(p.a)*.7;p.a+=.02;if(p.y>H){p.y=-10;p.x=Math.random()*W}cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='#ff5a5a';cx.beginPath();cx.ellipse(0,0,p.s,p.s/1.8,0,0,7);cx.fill();cx.restore()});requestAnimationFrame(loop)})();

function openOwner(){document.getElementById('ownerPop').style.display='flex'}
function closeOwner(){document.getElementById('ownerPop').style.display='none'}
function goChannels(){
  document.getElementById('loading').style.display='flex';
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('intro').style.display='none';
    document.getElementById('channels').style.display='block';
    window.scrollTo(0,0);
  },1500);
}

let channels=[
 {name:"Umrani Sports HD",cat:"Sports",img:"https://via.placeholder.com/300x150/ff2d55/fff?text=SPORTS",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {name:"Umrani News 24",cat:"News",img:"https://via.placeholder.com/300x150/007bff/fff?text=NEWS",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {name:"Umrani Entertainment",cat:"Entertainment",img:"https://via.placeholder.com/300x150/28a745/fff?text=ENTERTAINMENT",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {name:"Abu Dhabi T10 2026",cat:"Sports",img:"https://via.placeholder.com/300x150/ff9800/fff?text=T10",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {name:"Cricket Live HD",cat:"Sports",img:"https://via.placeholder.com/300x150/673ab7/fff?text=CRICKET",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 {name:"Umrani Islamic",cat:"Entertainment",img:"https://via.placeholder.com/300x150/009688/fff?text=ISLAMIC",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
];
let currentCat="All";
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let grid=document.getElementById('grid');grid.innerHTML="";
 channels.filter(c=>(currentCat=="All"||c.cat==currentCat)&&c.name.toLowerCase().includes(q)).forEach(c=>{
  grid.innerHTML+=`<div class="card" onclick="playChannel('${c.url}','${c.name}')"><img src="${c.img}"><p><span class="live">LIVE</span><br>${c.name}</p></div>`;
 });
}
function filterCat(cat,btn){currentCat=cat;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function playChannel(url,name){
 document.getElementById('playerBox').style.display="flex";
 document.getElementById('playingName').innerText=name;
 let video=document.getElementById('video');
 if(Hls.isSupported()){let hls=new Hls();hls.loadSource(url);hls.attachMedia(video)}
 else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url}
}
function closePlayer(){document.getElementById('playerBox').style.display="none";document.getElementById('video').pause()}
render();
</script>
</body>
</html>
