
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;background:#000;color:#fff;
  font-family:Arial,Helvetica,sans-serif;overflow-x:hidden
}
#canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.box{
  position:relative;z-index:2;min-height:100vh;width:100%;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:24px
}
h1{margin:0;font-family:Arial Black,Arial,sans-serif;font-weight:900;line-height:.95}
.umrani{
  font-size:clamp(38px,10vw,85px);color:#ff3300;
  text-shadow:0 0 20px red,0 0 40px orange,0 0 70px red
}
.tv{
  font-size:clamp(32px,8vw,48px);margin-top:8px;
  color:#ffcc00;text-shadow:0 0 15px orange,0 0 30px red;
  letter-spacing:3px
}

/* BUTTERFLIES */
.brand-area{position:relative;display:flex;flex-direction:column;align-items:center}
.butterfly{
  position:absolute;font-size:clamp(23px,5vw,38px);
  pointer-events:none;filter:drop-shadow(0 0 8px #ff55e8);
  animation:butterflyFly 3s ease-in-out infinite,
  wingFlutter .35s ease-in-out infinite alternate
}
.butterfly.one{top:0;left:-45px}
.butterfly.two{top:35px;right:-48px;animation-delay:.7s}
.butterfly.three{bottom:0;left:-28px;animation-delay:1.2s}
.butterfly.four{bottom:5px;right:-30px;animation-delay:.4s}
@keyframes butterflyFly{
  0%,100%{translate:0 0}
  25%{translate:12px -15px}
  50%{translate:0 -25px}
  75%{translate:-12px -10px}
}
@keyframes wingFlutter{
  from{scale:1 .8;rotate:-12deg}
  to{scale:1.15 1;rotate:12deg}
}

.tag{margin-top:18px;letter-spacing:1px;font-size:15px}
.btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a.btn,button.btn{
  padding:12px 23px;border:2px solid #00eaff;color:#00eaff;
  border-radius:30px;text-decoration:none;font-weight:bold;
  background:rgba(0,0,0,.72);font-size:14px;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease
}
a.btn:hover,button.btn:hover{
  transform:translateY(-3px);box-shadow:0 0 18px currentColor
}
a.btn2{border-color:#ffaa00;color:#ffaa00}
button.btn-owner{border-color:#ff55e8;color:#ff8cf0}
.owner-panel{
  display:none;width:min(360px,100%);margin-top:26px;padding:20px;
  background:rgba(10,10,18,.92);border:1px solid #ff55e8;
  border-radius:20px;box-shadow:0 0 25px #ff00d433;
  animation:panelIn .35s ease both
}
.owner-panel.show{display:block}
.owner-photo{
  display:block;width:190px;height:190px;max-width:70vw;
  max-height:70vw;object-fit:cover;border-radius:50%;
  margin:0 auto 15px;border:3px solid #00eaff;
  box-shadow:0 0 22px #00eaff88;animation:floatPhoto 3s ease-in-out infinite
}
.owner-name{font-size:23px;color:#ffcc00;margin:8px 0}
.owner-caption{font-size:13px;color:#ddd;line-height:1.5;margin:0}
@keyframes floatPhoto{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-12px) rotate(1deg)}
}
@keyframes panelIn{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* SAKURA INTRO */
#sakura{
  display:none;position:fixed;inset:0;z-index:10;
  width:100%;height:100%;overflow:hidden;
  background:#100817 url("https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/bg.png") center/cover no-repeat
}
#sakura.show{display:block}
#sakura:after{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.08) 45%,rgba(0,0,0,.42));
  pointer-events:none
}
#petals{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.welcome{
  position:absolute;z-index:6;top:7%;left:50%;transform:translateX(-50%);
  width:94%;color:#fff;text-align:center;font-weight:900;
  font-size:clamp(20px,4.8vw,38px);line-height:1.3;
  text-shadow:0 0 8px #ff4fb8,0 0 18px #ff1493,0 0 35px #ff69b4;
  animation:welcomeGlow 1.8s ease-in-out infinite alternate
}
@keyframes welcomeGlow{
  from{filter:brightness(.9);transform:translateX(-50%) scale(1)}
  to{filter:brightness(1.35);transform:translateX(-50%) scale(1.025)}
}
.japanese{
  position:absolute;z-index:5;right:3%;top:25%;
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:clamp(18px,4vw,30px);letter-spacing:8px;
  color:#fff0fa;text-shadow:0 0 12px #ff65bb;opacity:.9
}
.sakura-scene{
  position:absolute;z-index:3;bottom:0;left:50%;
  transform:translateX(-50%);width:100%;height:90%;
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(4px,3vw,35px)
}
.sakura-person{
  display:block;width:auto;height:82vh;max-height:90%;max-width:52%;
  object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 0 12px rgba(0,0,0,.65));
  animation:personEnter 1.1s ease both
}
.sakura-girl{
  display:block;width:auto;height:70vh;max-height:78%;max-width:47%;
  object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 0 12px rgba(0,0,0,.65));
  animation:girlEnter 1.1s ease both
}
@keyframes personEnter{
  from{opacity:0;transform:translateX(-35px) scale(.85)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes girlEnter{
  from{opacity:0;transform:translateX(35px) scale(.85)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
.intro-loading{
  position:absolute;z-index:7;bottom:15px;left:0;width:100%;
  text-align:center;font-size:14px;color:white;text-shadow:0 0 12px #ff69b4
}

/* CHANNELS */
#channelsPage{
  display:none;position:relative;z-index:2;min-height:100vh;
  flex-direction:column;align-items:center;padding:25px 15px;
  background:radial-gradient(circle at top,#17172b,#050505 70%)
}
#channelsPage.show{display:flex}
.channels-heading{
  color:#00eaff;text-align:center;font-size:clamp(25px,6vw,40px);
  text-shadow:0 0 12px #00eaff;margin:18px 0 25px
}
.back-btn{
  align-self:flex-start;padding:10px 17px;border:1px solid #00eaff;
  border-radius:9px;color:#00eaff;background:transparent;cursor:pointer
}
#channelList{
  width:100%;max-width:1000px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px
}
.channel-card{
  min-width:0;min-height:135px;padding:16px 10px;
  border:1px solid #00eaff66;border-radius:14px;background:#111827;
  color:white;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  box-shadow:0 0 12px #00eaff18;transition:.2s
}
.channel-card:hover{
  border-color:#00eaff;box-shadow:0 0 18px #00eaff66;transform:translateY(-3px)
}
.channel-card img{width:58px;height:58px;object-fit:contain}
.channel-card strong{font-size:15px;text-align:center;overflow-wrap:anywhere}
#emptyMessage{display:none;color:#ccc;text-align:center;margin:30px 0}

/* CUSTOM PLAYER */
#playerBox{
  display:none;width:100%;max-width:850px;margin-top:25px;
  padding:12px;background:#080d18;border:1px solid #00eaff;
  border-radius:16px;box-shadow:0 0 20px #00eaff33
}
#playerTitle{
  color:#00eaff;margin:5px 0 12px;text-align:center;
  text-shadow:0 0 10px #00eaff
}
.player-screen{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#000;overflow:hidden;border-radius:10px;border:1px solid #00eaff66
}
.player-stage{
  width:100%;height:100%;filter:brightness(1);
  transition:filter .2s ease
}
#tvPlayer,#youtubePlayer,#youtubePlayer iframe{
  width:100%;height:100%;display:block;border:0;background:#000;object-fit:contain
}
#youtubePlayer{display:none}
.player-watermark{
  position:absolute;top:10px;left:10px;z-index:5;padding:6px 10px;
  color:white;font-size:13px;font-weight:900;letter-spacing:1px;
  border:1px solid #00eaff;border-radius:8px;background:rgba(0,0,0,.65);
  text-shadow:0 0 8px #00eaff;box-shadow:0 0 10px #00eaff66;
  pointer-events:none
}
.custom-controls{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:12px;padding:14px 5px 5px
}
.control-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:#00eaff;font-size:12px;min-width:110px
}
.control-item input{width:110px;accent-color:#00eaff}
.custom-controls button{
  padding:10px 13px;border:1px solid #00eaff;border-radius:9px;
  color:#00eaff;background:#07111c;font-weight:bold;cursor:pointer
}
.custom-controls button:active{background:#00eaff;color:#000}
.player-screen:fullscreen{
  width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0
}

@media(max-width:600px){
  .box{padding:20px 14px}
  .sakura-scene{height:86%;gap:0}
  .sakura-person{height:68vh;max-height:85%;max-width:52%}
  .sakura-girl{height:58vh;max-height:68%;max-width:48%}
  .welcome{top:8%;font-size:clamp(19px,5vw,27px)}
  .japanese{right:1%;top:30%;font-size:17px;letter-spacing:5px}
  #channelList{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .channel-card{min-height:120px}
  #channelsPage{padding:18px 12px}
  .custom-controls{gap:9px}
  .control-item{min-width:95px}
  .control-item input{width:90px}
  .custom-controls button{font-size:12px;padding:9px}
  .player-watermark{font-size:11px}
}
@media(max-width:360px){
  .sakura-person{height:62vh}
  .sakura-girl{height:52vh}
  .welcome{font-size:18px}
  .butterfly{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<canvas id="canvas" aria-hidden="true"></canvas>

<!-- HOME PAGE -->
<main class="box" id="homePage">
  <div class="brand-area">
    <span class="butterfly one">🦋</span>
    <span class="butterfly two">🦋</span>
    <span class="butterfly three">🦋</span>
    <span class="butterfly four">🦋</span>
    <h1 class="umrani">𓆩UM꧊ꝛ͢𓂃aNi𖡼</h1>
    <h1 class="tv">TV</h1>
  </div>

  <div class="tag">Open Website and Enjoy TV 🍿🎥</div>

  <div class="btns">
    <button class="btn btn-owner" id="owner-button" type="button"
      aria-expanded="false" aria-controls="owner-panel">Website Owner</button>
    <button class="btn btn2" type="button" onclick="startSakura()">Show Channels</button>
  </div>

  <section class="owner-panel" id="owner-panel" aria-label="Website owner profile">
    <img class="owner-photo" src="ubaid.jpg" alt="Website owner photo"
      onerror="this.onerror=null;this.src='https://placehold.co/400x400/171820/00eaff?text=Check+Photo+Filename'">
    <h2 class="owner-name">𓆩❍Ꮿη̽e꧊ꝛ͢𓂃𖡼</h2>
    <p class="owner-caption">Ubaidullah BaLoch</p>
  </section>
</main>

<!-- SAKURA INTRO -->
<section id="sakura" aria-label="Sakura welcome animation">
  <canvas id="petals"></canvas>
  <div class="welcome">Welcome To UMRANi TV Enjoys Guys 😊</div>
  <div class="japanese">さくら 花びら 春の夜</div>

  <div class="sakura-scene">
    <img class="sakura-person"
      src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png"
      alt="Ubaidullah">
    <img class="sakura-girl"
      src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png"
      alt="Sakura girl">
  </div>
  <div class="intro-loading">🌸 Loading Channels... 🌸</div>
</section>

<!-- CHANNELS PAGE -->
<section id="channelsPage">
  <button class="back-btn" onclick="goHome()">← Home</button>
  <h1 class="channels-heading">𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</h1>
  <div id="channelList"></div>
  <p id="emptyMessage">No channels added yet.</p>

  <!-- PLAYER -->
  <div id="playerBox">
    <h3 id="playerTitle">Now Playing</h3>

    <div class="player-screen" id="playerScreen">
      <div class="player-stage" id="playerStage">
        <video id="tvPlayer" controls playsinline></video>
        <div id="youtubePlayer"></div>
      </div>
      <div class="player-watermark">𓆩 UMRANi TV 𓆪</div>
    </div>

    <div class="custom-controls">
      <div class="control-item">
        <span>☀️ Light</span>
        <input id="brightnessControl" type="range" min="40" max="150" value="100">
      </div>
      <div class="control-item">
        <span>🔊 Volume</span>
        <input id="volumeControl" type="range" min="0" max="100" value="80">
      </div>
      <button type="button" id="fullscreenButton">⛶ Fullscreen</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="channels.js"></script>

<script>
/* OWNER PANEL */
const ownerButton=document.getElementById("owner-button");
const ownerPanel=document.getElementById("owner-panel");

ownerButton.addEventListener("click",()=>{
  const isOpen=ownerPanel.classList.toggle("show");
  ownerButton.setAttribute("aria-expanded",String(isOpen));
  if(isOpen) ownerPanel.scrollIntoView({behavior:"smooth",block:"nearest"});
});

/* BUILD CHANNEL CARDS */
const channelList=document.getElementById("channelList");
const emptyMessage=document.getElementById("emptyMessage");
const channels=window.channels||[];

if(channels.length===0){
  emptyMessage.style.display="block";
}else{
  emptyMessage.style.display="none";
}

channels.forEach(channel=>{
  const card=document.createElement("button");
  card.type="button";
  card.className="channel-card";

  const logo=document.createElement("img");
  logo.src=channel.logo;
  logo.alt=channel.name+" logo";

  const emoji=document.createElement("span");
  emoji.textContent="📺";
  emoji.style.display="none";
  emoji.style.fontSize="48px";

  logo.onerror=()=>{
    logo.style.display="none";
    emoji.style.display="block";
  };

  const title=document.createElement("strong");
  title.textContent=channel.name;

  card.append(logo,emoji,title);
  card.addEventListener("click",()=>playChannel(channel.url,channel.name));
  channelList.appendChild(card);
});

/* PAGE CONTROL */
let introTimer=null;

function startSakura(){
  document.getElementById("homePage").style.display="none";
  document.getElementById("channelsPage").classList.remove("show");
  document.getElementById("sakura").classList.add("show");
  startPetals();

  clearTimeout(introTimer);
  introTimer=setTimeout(()=>{
    stopPetals();
    document.getElementById("sakura").classList.remove("show");
    document.getElementById("channelsPage").classList.add("show");
  },5000);
}

function goHome(){
  clearTimeout(introTimer);
  stopPetals();
  stopVideo();
  document.getElementById("sakura").classList.remove("show");
  document.getElementById("channelsPage").classList.remove("show");
  document.getElementById("homePage").style.display="flex";
}

/* SAKURA PETALS */
const petalCanvas=document.getElementById("petals");
const pctx=petalCanvas.getContext("2d");
let petals=[];
let petalAnimation=null;

function resizePetals(){
  const ratio=window.devicePixelRatio||1;
  petalCanvas.width=window.innerWidth*ratio;
  petalCanvas.height=window.innerHeight*ratio;
  petalCanvas.style.width=window.innerWidth+"px";
  petalCanvas.style.height=window.innerHeight+"px";
  pctx.setTransform(ratio,0,0,ratio,0,0);
}
window.addEventListener("resize",resizePetals);
resizePetals();

function createPetals(){
  petals=[];
  for(let i=0;i<65;i++){
    petals.push({
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      size:4+Math.random()*7,
      speed:.7+Math.random()*2,
      drift:Math.random()*1.8-.9,
      angle:Math.random()*Math.PI*2,
      spin:Math.random()*.045-.022
    });
  }
}

function drawPetals(){
  pctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  petals.forEach(p=>{
    p.y+=p.speed;
    p.x+=p.drift;
    p.angle+=p.spin;
    if(p.y>window.innerHeight+15){p.y=-15;p.x=Math.random()*window.innerWidth}
    if(p.x>window.innerWidth+15)p.x=-15;
    if(p.x<-15)p.x=window.innerWidth+15;
    pctx.save();
    pctx.translate(p.x,p.y);
    pctx.rotate(p.angle);
    pctx.fillStyle="rgba(255,170,215,.88)";
    pctx.beginPath();
    pctx.ellipse(0,0,p.size*.65,p.size,0,0,Math.PI*2);
    pctx.fill();
    pctx.restore();
  });
  petalAnimation=requestAnimationFrame(drawPetals);
}

function startPetals(){
  resizePetals();
  createPetals();
  if(petalAnimation)cancelAnimationFrame(petalAnimation);
  drawPetals();
}
function stopPetals(){
  if(petalAnimation){
    cancelAnimationFrame(petalAnimation);
    petalAnimation=null;
  }
  pctx.clearRect(0,0,window.innerWidth,window.innerHeight);
}

/* UNIVERSAL PLAYER */
let activeHls=null;

const video=document.getElementById("tvPlayer");
const playerBox=document.getElementById("playerBox");
const playerScreen=document.getElementById("playerScreen");
const playerStage=document.getElementById("playerStage");
const youtubePlayer=document.getElementById("youtubePlayer");

function getYouTubeId(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtu.be")){
      return u.pathname.split("/").filter(Boolean)[0]||null;
    }
    if(u.searchParams.get("v"))return u.searchParams.get("v");
    const parts=u.pathname.split("/").filter(Boolean);
    const index=parts.findIndex(p=>["live","embed","shorts"].includes(p));
    if(index!==-1)return parts[index+1]||null;
  }catch(e){}
  return null;
}

function playChannel(url,name){
  stopVideo();
  playerBox.style.display="block";
  document.getElementById("playerTitle").textContent=name;

  playerStage.style.filter="brightness(1)";
  document.getElementById("brightnessControl").value=100;
  document.getElementById("volumeControl").value=80;

  const youtubeId=getYouTubeId(url);

  if(youtubeId){
    video.style.display="none";
    youtubePlayer.style.display="block";

    const iframe=document.createElement("iframe");
    iframe.src="https://www.youtube.com/embed/"+encodeURIComponent(youtubeId)+
      "?autoplay=1&rel=0&playsinline=1&enablejsapi=1";
    iframe.title=name;
    iframe.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen=true;
    youtubePlayer.appendChild(iframe);

  }else{
    youtubePlayer.style.display="none";
    video.style.display="block";

    if(url.includes(".m3u8")&&window.Hls&&Hls.isSupported()){
      activeHls=new Hls();
      activeHls.loadSource(url);
      activeHls.attachMedia(video);
      activeHls.on(Hls.Events.MANIFEST_PARSED,()=>{
        video.play().catch(()=>{});
      });
    }else{
      video.src=url;
      video.play().catch(()=>{});
    }
  }

  playerBox.scrollIntoView({behavior:"smooth",block:"center"});
}

function stopVideo(){
  if(activeHls){
    activeHls.destroy();
    activeHls=null;
  }
  video.pause();
  video.removeAttribute("src");
  video.load();
  youtubePlayer.innerHTML="";
  youtubePlayer.style.display="none";
  video.style.display="block";
  playerBox.style.display="none";
}

/* BRIGHTNESS */
document.getElementById("brightnessControl").addEventListener("input",function(){
  playerStage.style.filter="brightness("+Number(this.value)/100+")";
});

/* VOLUME: VIDEO AND YOUTUBE */
document.getElementById("volumeControl").addEventListener("input",function(){
  const volume=Number(this.value);
  video.volume=volume/100;
  video.muted=volume===0;

  const iframe=youtubePlayer.querySelector("iframe");
  if(iframe&&iframe.contentWindow){
    iframe.contentWindow.postMessage(JSON.stringify({
      event:"command",func:"setVolume",args:[volume]
    }),"https://www.youtube.com");
    if(volume===0){
      iframe.contentWindow.postMessage(JSON.stringify({
        event:"command",func:"mute",args:[]
      }),"https://www.youtube.com");
    }else{
      iframe.contentWindow.postMessage(JSON.stringify({
        event:"command",func:"unMute",args:[]
      }),"https://www.youtube.com");
    }
  }
});

/* FULLSCREEN */
document.getElementById("fullscreenButton").addEventListener("click",()=>{
  if(!document.fullscreenElement){
    if(playerScreen.requestFullscreen)playerScreen.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
});
</script>

<!-- NEON TUBES CURSOR -->
<script type="module">
import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js";
try{
  const app=TubesCursor(document.getElementById("canvas"),{
    tubes:{
      colors:["#00eaff","#ff00ff","#00ff88"],
      lights:{
        intensity:200,
        colors:["#00eaff","#ff00aa","#ffae00","#00ae5d"]
      }
    }
  });

  function randomColors(){
    if(app&&app.tubes){
      const color=()=>"#"+Math.floor(Math.random()*16777215)
        .toString(16).padStart(6,"0");
      app.tubes.setColors([color(),color()]);
    }
  }
  document.body.addEventListener("click",randomColors);
}catch(error){
  console.warn("Animated background could not load.",error);
}
</script>

</body>
</html>
