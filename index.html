
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button {
  font: inherit;
}

.page {
  min-height: 100vh;
  display: none;
}

.page.active {
  display: flex;
}

/* HOME PAGE */
#home {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 15px;
  background:
    radial-gradient(circle at center, #171717 0%, #050505 65%);
}

.main-title {
  color: #00ffff;
  font-size: clamp(25px, 6vw, 48px);
  text-shadow: 0 0 10px #00ffff, 0 0 25px #0088ff;
  margin-bottom: 35px;
  overflow-wrap: anywhere;
}

.main-btn {
  width: min(260px, 85vw);
  padding: 14px 18px;
  margin: 10px;
  border: 1px solid #00ffff;
  border-radius: 12px;
  background: transparent;
  color: #00ffff;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 12px #00ffff55;
  transition: .25s;
}

.main-btn:hover {
  background: #00ffff;
  color: black;
  box-shadow: 0 0 25px #00ffff;
}

/* OWNER PANEL */
#ownerPanel {
  display: none;
  width: min(340px, 90vw);
  margin-top: 20px;
  padding: 22px;
  border: 1px solid #00ffff;
  border-radius: 16px;
  background: #101010;
  box-shadow: 0 0 20px #00ffff44;
}

#ownerPanel img {
  width: 125px;
  height: 125px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #00ffff;
  margin-bottom: 12px;
}

#ownerPanel h2 {
  color: #00ffff;
  font-size: 22px;
  margin-bottom: 7px;
}

#ownerPanel p {
  color: #ccc;
}

/* SAKURA INTRO */
#sakura {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  overflow: hidden;
  background: #080611 url("https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/bg.png") center/cover no-repeat;
}

#sakura.active {
  display: flex;
}

#petalCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}

.sakura-title {
  position: absolute;
  z-index: 5;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: clamp(18px, 4vw, 30px);
  text-shadow: 0 0 12px #ff80c8;
  white-space: nowrap;
}

.sakura-scene {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 88%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(5px, 4vw, 45px);
  z-index: 2;
}

.sakura-person,
.sakura-girl {
  display: block;
  width: auto;
  object-fit: contain;
  object-position: bottom;
  filter: drop-shadow(0 0 12px #0008);
}

.sakura-person {
  height: 70vh;
  max-width: 46%;
}

.sakura-girl {
  height: 70vh;
  max-width: 46%;
}

.loading-text {
  position: absolute;
  z-index: 6;
  bottom: 18px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 14px;
  text-shadow: 0 0 10px #ff69b4;
}

/* CHANNEL PAGE */
#channelsPage {
  flex-direction: column;
  align-items: center;
  padding: 25px 15px;
  background:
    radial-gradient(circle at top, #15152a, #050505 65%);
}

.channels-heading {
  color: #00ffff;
  font-size: clamp(25px, 6vw, 38px);
  text-align: center;
  text-shadow: 0 0 12px #00ffff;
  margin: 10px 0 25px;
}

.back-btn {
  align-self: flex-start;
  padding: 10px 17px;
  border: 1px solid #00ffff;
  border-radius: 9px;
  color: #00ffff;
  background: transparent;
  cursor: pointer;
}

#channelList {
  width: 100%;
  max-width: 1000px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(145px, 100%), 1fr));
  gap: 15px;
}

.channel-card {
  min-width: 0;
  min-height: 135px;
  padding: 18px 10px;
  border: 1px solid #00ffff66;
  border-radius: 14px;
  background: #111827;
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 0 12px #00ffff18;
  transition: .2s;
}

.channel-card:hover {
  border-color: #00ffff;
  box-shadow: 0 0 18px #00ffff66;
  transform: translateY(-3px);
}

.channel-card img {
  width: 58px;
  height: 58px;
  object-fit: contain;
}

.channel-emoji {
  font-size: 48px;
  line-height: 58px;
}

.channel-card strong {
  font-size: 15px;
  text-align: center;
  overflow-wrap: anywhere;
}

#emptyMessage {
  display: none;
  color: #ccc;
  text-align: center;
  margin: 30px 0;
}

/* VIDEO PLAYER */
#playerBox {
  display: none;
  width: 100%;
  max-width: 850px;
  margin-top: 25px;
  padding: 12px;
  background: #111;
  border: 1px solid #00ffff66;
  border-radius: 14px;
}

#playerTitle {
  color: #00ffff;
  margin-bottom: 12px;
  text-align: center;
}

#tvPlayer {
  width: 100%;
  max-height: 65vh;
  background: black;
  border-radius: 8px;
}

@media (max-width: 600px) {
  .sakura-scene {
    height: 78%;
    gap: 2px;
  }

  .sakura-person,
  .sakura-girl {
    height: 57vh;
    max-width: 49%;
  }

  .sakura-title {
    top: 10%;
    white-space: normal;
    width: 90%;
    text-align: center;
  }

  #channelList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .channel-card {
    min-height: 120px;
  }

  #channelsPage {
    padding: 18px 12px;
  }
}

@media (max-width: 360px) {
  .sakura-person,
  .sakura-girl {
    height: 50vh;
  }
}
</style>
</head>

<body>

<!-- HOME -->
<section id="home" class="page active">
  <h1 class="main-title">𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</h1>

  <button class="main-btn" onclick="toggleOwner()">
    Website Owner
  </button>

  <div id="ownerPanel">
    <img src="ubaid.jpg" alt="Website Owner"
         onerror="this.style.display='none'">
    <h2>Ubaidullah BaLoch</h2>
    <p>Website Owner</p>
  </div>

  <button class="main-btn" onclick="startSakura()">
    Show Channels
  </button>
</section>

<!-- SAKURA INTRO -->
<section id="sakura" class="page">
  <canvas id="petalCanvas"></canvas>

  <div class="sakura-title">さくら 🌸 Welcome</div>

  <div class="sakura-scene">
    <img
      class="sakura-person"
      src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png"
      alt="Ubaidullah"
    >

    <img
      class="sakura-girl"
      src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png"
      alt="Sakura Girl"
    >
  </div>

  <div class="loading-text">Loading Channels... 🌸</div>
</section>

<!-- CHANNELS -->
<section id="channelsPage" class="page">
  <button class="back-btn" onclick="goHome()">← Home</button>

  <h1 class="channels-heading">𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</h1>

  <div id="channelList"></div>
  <p id="emptyMessage">No channels added yet. Add channels in channels.js</p>

  <div id="playerBox">
    <h3 id="playerTitle">Now Playing</h3>
    <video id="tvPlayer" controls playsinline></video>
  </div>
</section>

<!-- HLS support for compatible .m3u8 streams -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Separate channel data and rendering file -->
<script src="channels.js"></script>

<script>
function showPage(pageId) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");
}

function toggleOwner() {
  const panel = document.getElementById("ownerPanel");
  panel.style.display =
    panel.style.display === "block" ? "none" : "block";
}

let introTimer = null;

function startSakura() {
  showPage("sakura");
  startPetals();

  clearTimeout(introTimer);

  // Sakura intro runs for exactly 10 seconds
  introTimer = setTimeout(() => {
    stopPetals();
    showPage("channelsPage");
  }, 10000);
}

function goHome() {
  clearTimeout(introTimer);
  stopPetals();
  stopVideo();
  showPage("home");
}

/* SAKURA PETAL ANIMATION */
const canvas = document.getElementById("petalCanvas");
const ctx = canvas.getContext("2d");

let petals = [];
let animationFrame = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function makePetals() {
  petals = [];

  for (let i = 0; i < 45; i++) {
    petals.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 4 + Math.random() * 7,
      speed: 0.7 + Math.random() * 1.8,
      drift: Math.random() * 1.5 - 0.75,
      rotation: Math.random() * 6,
      spin: Math.random() * 0.04 - 0.02
    });
  }
}

function drawPetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  petals.forEach(p => {
    p.y += p.speed;
    p.x += p.drift;
    p.rotation += p.spin;

    if (p.y > canvas.height + 15) {
      p.y = -15;
      p.x = Math.random() * canvas.width;
    }

    if (p.x > canvas.width + 15) p.x = -15;
    if (p.x < -15) p.x = canvas.width + 15;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillStyle = "rgba(255, 160, 205, 0.85)";
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.65, p.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  animationFrame = requestAnimationFrame(drawPetals);
}

function startPetals() {
  resizeCanvas();
  makePetals();

  if (animationFrame) cancelAnimationFrame(animationFrame);
  drawPetals();
}

function stopPetals() {
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* VIDEO PLAYER */
let activeHls = null;

function playChannel(url, name) {
  const video = document.getElementById("tvPlayer");
  const playerBox = document.getElementById("playerBox");

  stopVideo();

  document.getElementById("playerTitle").textContent = name;
  playerBox.style.display = "block";

  if (url.includes(".m3u8") && window.Hls && Hls.isSupported()) {
    activeHls = new Hls();
    activeHls.loadSource(url);
    activeHls.attachMedia(video);
    activeHls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(() => {});
    });
  } else {
    video.src = url;
    video.play().catch(() => {});
  }

  playerBox.scrollIntoView({ behavior: "smooth", block: "center" });
}

function stopVideo() {
  const video = document.getElementById("tvPlayer");

  if (activeHls) {
    activeHls.destroy();
    activeHls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  document.getElementById("playerBox").style.display = "none";
}
</script>

</body>
</html>
