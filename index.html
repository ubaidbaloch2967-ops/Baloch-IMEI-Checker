<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>𓆩UM꧊ꝛ͢𓂃aNi𖡼 TV</title>

<style>
/* HOME PAGE */
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

#canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:1;
}

.home-page{
position:relative;
z-index:2;
min-height:100vh;
width:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:24px;
}

.home-page h1{
margin:0;
font-family:Arial Black,Arial,sans-serif;
font-weight:900;
line-height:.95;
}

.umrani{
font-size:clamp(52px,13vw,85px);
color:#ff3300;
text-shadow:0 0 20px red,0 0 40px orange,0 0 70px red;
}

.tv{
font-size:clamp(32px,8vw,48px);
margin-top:8px;
color:#ffcc00;
text-shadow:0 0 15px orange,0 0 30px red;
letter-spacing:3px;
}

.tag{
margin-top:18px;
letter-spacing:1px;
font-size:15px;
}

.btns{
margin-top:32px;
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

a.btn,button.btn{
padding:12px 23px;
border:2px solid #00eaff;
color:#00eaff;
border-radius:30px;
text-decoration:none;
font-weight:bold;
background:rgba(0,0,0,.72);
font-size:14px;
cursor:pointer;
transition:transform .2s ease,box-shadow .2s ease;
}

a.btn:hover,button.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 18px currentColor;
}

a.btn2{
border-color:#ffaa00;
color:#ffaa00;
}

button.btn-owner{
border-color:#ff55e8;
color:#ff8cf0;
}

.owner-panel{
display:none;
width:min(360px,100%);
margin-top:26px;
padding:20px;
background:rgba(10,10,18,.92);
border:1px solid #ff55e8;
border-radius:20px;
box-shadow:0 0 25px #ff00d433;
animation:panelIn .35s ease both;
}

.owner-panel.show{display:block}

.owner-photo{
display:block;
width:190px;
height:190px;
max-width:70vw;
max-height:70vw;
object-fit:cover;
border-radius:50%;
margin:0 auto 15px;
border:3px solid #00eaff;
box-shadow:0 0 22px #00eaff88;
animation:floatPhoto 3s ease-in-out infinite;
}

.owner-name{
font-size:23px;
color:#ffcc00;
margin:8px 0;
}

.owner-caption{
font-size:13px;
color:#ddd;
line-height:1.5;
margin:0;
}

@keyframes floatPhoto{
0%,100%{transform:translateY(0) rotate(-1deg)}
50%{transform:translateY(-12px) rotate(1deg)}
}

@keyframes panelIn{
from{opacity:0;transform:translateY(12px) scale(.97)}
to{opacity:1;transform:translateY(0) scale(1)}
}

/* SAKURA PAGE */

#sakura-page{
display:none;
position:fixed;
inset:0;
width:100%;
height:100%;
overflow:hidden;
background:#fff;
color:#111;
z-index:10;
}

#sakura-page.active{
display:block;
}

#scene{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:0;
}

#sakura-page .person{
position:absolute;
right:45%;
bottom:0;
height:50vh;
object-fit:contain;
z-index:1;
user-select:none;
}

#sakura-page .block{
height:100%;
position:absolute;
width:50%;
right:0;
z-index:1;
display:flex;
flex-direction:row;
justify-content:flex-end;
align-items:flex-end;
}

#sakura-page .roof{
display:block;
align-self:flex-start;
height:60vh;
width:auto;
object-fit:contain;
user-select:none;
}

#sakura-page .girl{
position:absolute;
left:30%;
display:block;
height:70vh;
width:auto;
object-fit:contain;
margin-right:20px;
user-select:none;
}

#sakura-page .haiku{
position:absolute;
top:5dvh;
left:80px;
writing-mode:vertical-rl;
text-orientation:mixed;
font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
font-size:32px;
line-height:2.2;
color:#111;
letter-spacing:0.08em;
filter:drop-shadow(2px 2px 2px rgba(0,0,0,.15));
font-weight:500;
user-select:none;
z-index:2;
}

.back-button{
position:absolute;
top:15px;
left:15px;
z-index:20;
padding:11px 20px;
border:2px solid #00aabb;
border-radius:25px;
background:#111;
color:#00eaff;
font-weight:bold;
cursor:pointer;
}

@media(max-width:600px){
#sakura-page .haiku{
left:15px;
font-size:22px;
}
#sakura-page .person{
right:40%;
height:40vh;
}
#sakura-page .girl{
height:55vh;
left:15%;
}
#sakura-page .roof{
height:45vh;
}
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation:none!important;
transition:none!important;
}
}
</style>
</head>

<section id="sakura-page">

<!-- HOME PAGE JAVASCRIPT -->

<script>
const ownerButton=document.getElementById('owner-button');
const ownerPanel=document.getElementById('owner-panel');

ownerButton.addEventListener('click',()=>{
const isOpen=ownerPanel.classList.toggle('show');

ownerButton.setAttribute(
'aria-expanded',
String(isOpen)
);

if(isOpen){
ownerPanel.scrollIntoView({
behavior:'smooth',
block:'nearest'
});
}
});


/* PAGE SWITCHING */

const homePage=document.getElementById('home-page');
const sakuraPage=document.getElementById('sakura-page');

document.getElementById('channels-button')
.addEventListener('click',()=>{

homePage.style.display='none';
sakuraPage.classList.add('active');

if(typeof resize==='function'){
resize();
}

});

document.getElementById('back-button')
.addEventListener('click',()=>{

sakuraPage.classList.remove('active');
homePage.style.display='flex';

});

</script>


<!-- ORIGINAL TUBES BACKGROUND -->

<script type="module">

import TubesCursor from
"https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js";

try{

const app=TubesCursor(
document.getElementById("canvas"),
{
tubes:{
colors:["#00eaff","#ff00ff","#00ff88"],
lights:{
intensity:200,
colors:[
"#00eaff",
"#ff00aa",
"#ffae00",
"#00ae5d"
]
}
}
}
);

function randomColors(){

if(app&&app.tubes){

const color=()=>
"#"+Math.floor(Math.random()*16777215)
.toString(16).padStart(6,"0");

app.tubes.setColors([color(),color()]);

}

}

document.body.addEventListener("click",randomColors);

}catch(error){

console.warn("Animated background could not load.",error);

}

</script>


<!-- ORIGINAL SAKURA ANIMATION JAVASCRIPT -->

<script>

const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");

let width=0;
let height=0;
let particles=[];

const settings={

bgColor:"#ffffff",

minWind:1,
maxWind:10,

minSize:14,
maxSize:38,

emitterY:0.15,
emitterSpread:0.85,

gravity:0.6,
turbulence:0.8,

rotationSpeed:0,
tumbleStrength:0.4,
staticTilt:0,

particleCount:150,

direction:-1

};

const cache={

minSize:0,
maxSize:0,
minWind:0,
maxWind:0,
tiltRad:0

};

function updateCache(){

cache.minSize=Math.min(settings.minSize,settings.maxSize);
cache.maxSize=Math.max(settings.minSize,settings.maxSize);

cache.minWind=Math.min(settings.minWind,settings.maxWind);
cache.maxWind=Math.max(settings.minWind,settings.maxWind);

cache.tiltRad=(settings.staticTilt*Math.PI)/180;

}

function createDefaultImage(){

const tempCanvas=document.createElement("canvas");

tempCanvas.width=128;
tempCanvas.height=128;

const tCtx=tempCanvas.getContext("2d");

tCtx.scale(2,2);

tCtx.beginPath();

tCtx.moveTo(32,5);

tCtx.quadraticCurveTo(5,32,32,59);
tCtx.quadraticCurveTo(59,32,32,5);

tCtx.fillStyle="#d66161";
tCtx.fill();

tCtx.strokeStyle="#F20404";
tCtx.lineWidth=2;
tCtx.stroke();

tCtx.beginPath();

tCtx.moveTo(32,5);
tCtx.lineTo(32,59);

tCtx.stroke();

const img=new Image();

img.src=tempCanvas.toDataURL();

return img;

}

const particleImage=createDefaultImage();


function rotateVector(x,y,z,ax,ay,az){

let cos=Math.cos(az);
let sin=Math.sin(az);

const x1=x*cos-y*sin;
const y1=x*sin+y*cos;
const z1=z;

cos=Math.cos(ay);
sin=Math.sin(ay);

const x2=x1*cos+z1*sin;
const y2=y1;
const z2=-x1*sin+z1*cos;

cos=Math.cos(ax);
sin=Math.sin(ax);

return{

x:x2,
y:y2*cos-z2*sin,
z:y2*sin+z2*cos

};

}


class Particle{

constructor(initOnScreen=false){

this.reset(initOnScreen);

}

reset(initOnScreen=false){

this.image=particleImage;

this.width=
cache.minSize+
Math.random()*(cache.maxSize-cache.minSize);

this.height=this.width;

const centerY=height*settings.emitterY;

const spreadHeight=height*settings.emitterSpread;

const minY=centerY-spreadHeight/2;
const maxY=centerY+spreadHeight/2;

this.y=minY+Math.random()*(maxY-minY);

if(initOnScreen){

this.x=Math.random()*width;

}else{

this.x=
settings.direction===-1
?width+this.width+Math.random()*width
:-this.width-Math.random()*width;

}

const sizeFactor=
(this.width-cache.minSize)/
(cache.maxSize-cache.minSize||1);

this.windFactor=
1-(sizeFactor*0.5+Math.random()*0.5);

this.windFactor=Math.max(
0.1,
Math.min(1,this.windFactor)
);

this.vx=0;
this.vy=0;

this.waveOffset=Math.random()*Math.PI*2;

this.angleZ=Math.random()*Math.PI*2;

this.spinZ=
(Math.random()-0.5)*settings.rotationSpeed;

this.angleX=0;
this.angleY=0;

this.spinX=(Math.random()-0.5)*0.1;
this.spinY=(Math.random()-0.5)*0.1;

}


update(){

const targetSpeed=
cache.minWind+
(cache.maxWind-cache.minWind)*this.windFactor;

this.vx+=(targetSpeed-this.vx)*0.1;

this.x+=this.vx*settings.direction;

const gravityMod=1.5-this.windFactor;

this.vy+=settings.gravity*0.05*gravityMod;

const wave=Math.sin(
this.x*0.01*settings.direction+this.waveOffset
);

this.vy+=wave*settings.turbulence*0.05;

this.vy*=0.98;

this.y+=this.vy;

this.angleZ+=this.spinZ+this.vx*0.002;

if(settings.tumbleStrength>0){

this.angleX+=this.spinX*settings.tumbleStrength;

this.angleY+=this.spinY*settings.tumbleStrength;

}

const buffer=200;

const outByX=
settings.direction===-1
?this.x < -buffer
:this.x > width+buffer;

if(
outByX||
this.y>height+buffer||
this.y < -buffer
){

this.reset(false);

}

}


draw(){

const vecU=rotateVector(
1,0,0,
this.angleX,
this.angleY+cache.tiltRad,
this.angleZ
);

const vecV=rotateVector(
0,1,0,
this.angleX,
this.angleY+cache.tiltRad,
this.angleZ
);

ctx.save();

ctx.translate(this.x,this.y);

ctx.transform(
vecU.x,
vecU.y,
vecV.x,
vecV.y,
0,
0
);

ctx.drawImage(
this.image,
-this.width/2,
-this.height/2,
this.width,
this.height
);

ctx.restore();

}

}


function resize(){

width=canvas.width=window.innerWidth;
height=canvas.height=window.innerHeight;

ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality="high";

}


function initParticles(){

particles=[];

for(let i=0;i<settings.particleCount;i++){

const particle=new Particle(false);

particle.x+=Math.random()*width*1.5;

particles.push(particle);

}

}


function animate(){

ctx.fillStyle=settings.bgColor;

ctx.fillRect(0,0,width,height);

for(const particle of particles){

particle.update();
particle.draw();

}

requestAnimationFrame(animate);

}


function start(){

updateCache();
resize();
initParticles();
animate();

window.addEventListener("resize",resize);

}

start();

</script>

</body>
