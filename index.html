
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMRANi TV</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050505;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 overflow-x:hidden;
}
#home{
 min-height:100vh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:radial-gradient(circle,#24100a,#050505 70%);
}
.logo{
 font-size:clamp(35px,8vw,65px);
 font-weight:900;
 color:#ff542e;
 text-shadow:0 0 15px #ff3100,0 0 35px #ff3100;
}
.logo span{color:#ffe34d}
.tagline{color:#ddd;margin:15px 0 30px}
button{
 background:#ff4b21;
 border:0;
 padding:13px 25px;
 border-radius:30px;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 margin:8px;
}
button:hover{background:#ff8b24}
.owner{
 margin-top:25px;
 padding:15px;
 border:1px solid #ff542e;
 border-radius:15px;
 background:#151515;
}
.owner img{
 width:85px;height:85px;
 object-fit:cover;border-radius:50%;
 border:2px solid orange;
}
#intro{
 display:none;
 position:fixed;
 inset:0;
 background:#f9dce7 url("https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/bg.png") center/cover;
 overflow:hidden;
 z-index:10;
}
.welcome{
 position:absolute;
 top:5%;
 width:100%;
 color:#fff;
 font-size:clamp(20px,4vw,34px);
 font-weight:bold;
 text-shadow:0 2px 8px #9b315d;
 z-index:3;
}
.japanese{
 position:absolute;
 right:3%;
 top:25%;
 writing-mode:vertical-rl;
 font-size:30px;
 color:#fff;
 text-shadow:0 0 8px #a22;
}
.sakura-scene{
 position:absolute;
 bottom:0;
 width:100%;
 height:80%;
 display:flex;
 justify-content:center;
 align-items:flex-end;
 gap:10px;
}
.sakura-scene img{
 height:70vh;
 max-width:46%;
 object-fit:contain;
 object-position:bottom;
}
#petals{
 position:absolute;
 inset:0;
 pointer-events:none;
}
.petal{
 position:absolute;
 top:-30px;
 width:13px;height:13px;
 background:#ffb5d0;
 border-radius:100% 0 100% 0;
 animation:fall linear forwards;
}
@keyframes fall{
 to{transform:translateY(110vh) rotate(720deg);opacity:.2}
}
#channels{
 display:none;
 min-height:100vh;
 padding:20px;
 background:#080808;
}
.channel-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:15px;
 max-width:900px;
 margin:25px auto;
}
.channel{
 background:#171717;
 border:1px solid #333;
 border-radius:14px;
 padding:18px 10px;
 cursor:pointer;
}
.channel:hover{border-color:#ff542e}
.channel img{
 width:75px;height:65px;
 object-fit:contain;
}
.channel h3{font-size:16px}
#playerBox{
 display:none;
 max-width:900px;
 margin:20px auto;
}
#playerBox iframe,#playerBox video{
 width:100%;
 aspect-ratio:16/9;
 border:0;
 background:#000;
 border-radius:12px;
}
.back{background:#444}
@media(max-width:600px){
 .sakura-scene img{height:58vh}
 .sakura-scene{gap:0}
 .japanese{font-size:22px}
}
@media(max-width:380px){
 .sakura-scene img{height:52vh}
}
</style>
</head>

<body>

<section id="home">
 <div class="logo">𓆩UM꧊ꝛ͢𓂃aNi𖡼 <span>TV</span></div>
 <div class="tagline">Open Website and Enjoy TV 🍿🎥</div>

 <button onclick="showOwner()">Website Owner</button>
 <button onclick="startIntro()">Show Channels</button>

 <div class="owner" id="ownerPanel" style="display:none">
  <img src="ubaid.jpg" alt="Owner">
  <h3>Ubaidullah BaLoch</h3>
  <p>Website Owner</p>
 </div>
</section>

<section id="intro">
 <div class="welcome">Welcome To UMRANi TV Enjoys Guys 😊</div>
 <div class="japanese">桜の花 • 日本</div>
 <div class="sakura-scene">
  <img src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png" alt="Photo">
  <img src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png" alt="Girl">
 </div>
 <div id="petals"></div>
</section>

<section id="channels">
 <h1 class="logo">UMRANi <span>TV</span></h1>
 <h2>Live TV Channels 📺</h2>
 <div id="channelList" class="channel-grid"></div>

 <div id="playerBox">
  <h2 id="playingName"></h2>
  <div id="videoPlayer"></div>
  <button class="back" onclick="closePlayer()">Close Player</button>
 </div>

 <button class="back" onclick="goHome()">Back to Home</button>
</section>

<script src="channels.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
function showOwner(){
 const panel=document.getElementById("ownerPanel");
 panel.style.display=panel.style.display==="none"?"block":"none";
}

function startIntro(){
 document.getElementById("home").style.display="none";
 document.getElementById("intro").style.display="block";

 const petals=document.getElementById("petals");
 petals.innerHTML="";

 for(let i=0;i<45;i++){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(4+Math.random()*5)+"s";
  p.style.animationDelay=Math.random()*3+"s";
  petals.appendChild(p);
 }

 setTimeout(()=>{
  document.getElementById("intro").style.display="none";
  document.getElementById("channels").style.display="block";
  loadChannels();
 },5000);
}

function loadChannels(){
 const list=document.getElementById("channelList");
 list.innerHTML="";

 channels.forEach((ch,index)=>{
  const card=document.createElement("div");
  card.className="channel";
  card.innerHTML=`
   ${ch.logo ? `<img src="${ch.logo}" alt="">` : ""}
   <h3>${ch.name}</h3>
   <button>Watch Live</button>
  `;
  card.onclick=()=>playChannel(index);
  list.appendChild(card);
 });
}

function playChannel(index){
 const ch=channels[index];
 const box=document.getElementById("playerBox");
 const player=document.getElementById("videoPlayer");

 box.style.display="block";
 document.getElementById("playingName").textContent=ch.name;
 player.innerHTML="";

 // YouTube video/live link
 if(ch.url.includes("youtube.com") || ch.url.includes("youtu.be")){
  let videoId="";
  try{
   const u=new URL(ch.url);
   videoId=u.searchParams.get("v") || u.pathname.split("/").filter(Boolean).pop();
  }catch(e){}

  if(videoId==="live") videoId="";

  const iframe=document.createElement("iframe");
  iframe.src="https://www.youtube.com/embed/"+videoId+"?autoplay=1";
  iframe.allow="autoplay; encrypted-media; picture-in-picture";
  iframe.allowFullscreen=true;
  player.appendChild(iframe);
 }
 // HLS stream
 else if(ch.url.includes(".m3u8")){
  const video=document.createElement("video");
  video.controls=true;
  video.autoplay=true;
  video.playsInline=true;
  player.appendChild(video);

  if(Hls.isSupported()){
   const hls=new Hls();
   hls.loadSource(ch.url);
   hls.attachMedia(video);
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
   video.src=ch.url;
  }
 }
 else{
  player.innerHTML="<p>Stream URL is not configured.</p>";
 }

 box.scrollIntoView({behavior:"smooth"});
}

function closePlayer(){
 document.getElementById("playerBox").style.display="none";
 document.getElementById("videoPlayer").innerHTML="";
}

function goHome(){
 closePlayer();
 document.getElementById("channels").style.display="none";
 document.getElementById("home").style.display="flex";
}
</script>

</body>
</html>
