<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umrani TV - All Live TV & Movies</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff}
#intro{min-height:100dvh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}
#intro h3{font-family:serif;font-size:30px;color:#111;background:#fff;padding:12px 20px;border-radius:14px;line-height:1.4}
#intro h3 small{font-size:18px}
.person{width:230px;margin:15px 0}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-row button{padding:13px 22px;border-radius:30px;border:none;font-weight:900;cursor:pointer;font-size:15px}
.btn-owner{background:#fff;color:#000}.btn-show{background:#ff2d55;color:#fff}
#ownerPop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;padding:20px}
.owner-box{background:#0a0a1a;border:2px solid #ff2d55;border-radius:22px;padding:22px;text-align:center;width:330px;max-width:90vw}
.owner-box img{width:170px;height:170px;object-fit:cover;border-radius:50%;border:3px solid #00e5ff}
.owner-box h2{color:#ffcc00;margin-top:12px}
.closeOwner{margin-top:14px;background:#ff2d55;border:none;color:#fff;padding:10px 20px;border-radius:12px}
#loading{display:none;position:fixed;inset:0;background:#000;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:55px;height:55px;border:5px solid #333;border-top:5px solid #ff2d55;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#channels{display:none}
header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;color:#ff2d55}.logo span{color:#fff}
.support{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:14px}
.hero{padding:20px 15px 0}.hero h1{font-size:32px;line-height:1.1}.hero h1 span{color:#ff2d55}.hero p{color:#aaa;margin-top:8px}
.search{width:100%;padding:13px;border-radius:12px;border:none;background:#2a2a3d;color:#fff;margin:15px 0;font-size:15px;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.cats button{padding:9px 16px;border-radius:20px;border:none;background:#2a2a3d;color:#fff;white-space:nowrap;cursor:pointer;font-size:13px}.cats button.active{background:#ff2d55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}
.card{background:#1e1e32;border-radius:12px;overflow:hidden;cursor:pointer;text-align:center;padding-bottom:10px}
.card img{width:100%;height:80px;object-fit:cover;background:#333}.card p{font-size:12px;margin-top:8px;padding:0 5px;line-height:1.3}
.live{font-size:10px;background:red;padding:2px 6px;border-radius:10px}
#playerBox{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#playerBox .top{padding:12px;display:flex;justify-content:space-between;align-items:center}
#playerBox button{background:#ff2d55;border:none;color:#fff;padding:8px 14px;border-radius:8px}
video{width:100%;flex:1;background:#000}
iframe#ytFrame{width:100%;flex:1;border:none;display:none}
canvas#scene{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>

<div id="intro">
<canvas id="scene"></canvas>
<h3>Enjoy our website<br><small>𓆩❍Ꮿη̽e꧊ꝛ͢𓂃𖡼<br>𓆩UM꧊ꝛ͢𓂃aNi𖡼</small></h3>
<img class="person" src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png">
<div class="btn-row"><button class="btn-owner" onclick="openOwner()">Website Owner</button><button class="btn-show" onclick="goChannels()">Show Channels</button></div>
</div>

<div id="ownerPop"><div class="owner-box"><img src="https://i.ibb.co/ZpCMYnK0/1000002505-removebg-preview.png"><h2>𓆩Owner𓂃𖡼</h2><p style="font-size:18px;color:#fff;font-weight:800">Ubaidullah BaLoch</p><p>Owner - Umrani TV</p><button class="closeOwner" onclick="closeOwner()">Close</button></div></div>
<div id="loading"><div class="spinner"></div><p>Loading Channels...</p></div>

<div id="channels">
<header><div class="logo">UMRANI <span>TV</span></div><a class="support" href="https://wa.me/923000000000">Support</a></header>
<div class="hero"><h1>Watch <span>live</span><br>anywhere.</h1><p>● Live now • Tamasha Style • All Channels + Movies</p>
<input class="search" id="search" placeholder="Search channels, drama, movie..." onkeyup="render()">
<div class="cats" id="cats"></div></div>
<div class="grid" id="grid"></div>
</div>

<div id="playerBox"><div class="top"><span id="playingName">Playing</span><button onclick="closePlayer()">✕ Close</button></div><video id="video" controls autoplay></video><iframe id="ytFrame" allowfullscreen></iframe></div>

<script>
const cv=document.getElementById('scene');const cx=cv.getContext('2d');let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<35;i++)pts.push({x:Math.random()*W,y:Math.random()*H,s:5+Math.random()*8,sp:.8+Math.random()*1.5,a:Math.random()*6});
(function loop(){cx.clearRect(0,0,W,H);pts.forEach(p=>{p.y+=p.sp;p.x+=Math.sin(p.a)*.7;p.a+=.02;if(p.y>H){p.y=-10;p.x=Math.random()*W}cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='#ff5a5a';cx.beginPath();cx.ellipse(0,0,p.s,p.s/1.8,0,0,7);cx.fill();cx.restore()});requestAnimationFrame(loop)})();
function openOwner(){document.getElementById('ownerPop').style.display='flex'}
function closeOwner(){document.getElementById('ownerPop').style.display='none'}
function goChannels(){document.getElementById('loading').style.display='flex';setTimeout(()=>{document.getElementById('loading').style.display='none';document.getElementById('intro').style.display='none';document.getElementById('channels').style.display='block';window.scrollTo(0,0)},1500)}
let YT="https://www.youtube.com/embed/live_stream?channel=";
let channels=[
 {name:"PTV Sports",cat:"Sports",img:"https://via.placeholder.com/300x150/006400/fff?text=PTV+SPORTS",type:"youtube",url:YT+"PTV_SPORTS_ID"},

 {name:"Hum News",cat:"News",img:"https://via.placeholder.com/300x150/e91e63/fff?text=HUM+NEWS",type:"youtube",url:YT+"HUM_NEWS_ID"},
 {name:"Bol News",cat:"News",img:"https://via.placeholder.com/300x150/ff5722/fff?text=BOL+NEWS",type:"youtube",url:YT+"BOL_ID"},
 {name:"Al Jazeera English",cat:"News",img:"https://via.placeholder.com/300x150/f57c00/fff?text=ALJAZEERA",type:"m3u8",url:"https://live-hls-web-aje.getaj.net/AJE/index.m3u8"},

 {name:"Madani Channel",cat:"Islamic",img:"https://via.placeholder.com/300x150/2e7d32/fff?text=MADANI",type:"youtube",url:YT+"MADANI_ID"},
 {name:"Kids Cartoon",cat:"Kids",img:"https://via.placeholder.com/300x150/ffeb3b/000?text=KIDS",type:"youtube",url:YT+"KIDS_ID"},
 {name:"Rhymes - Kids",cat:"Kids",img:"https://via.placeholder.com/300x150/f06292/fff?text=RHYMES",type:"youtube",url:YT+"RHYMES_ID"},
 {name:"Coke Studio",cat:"Music",img:"https://via.placeholder.com/300x150/d32f2f/fff?text=COKE+STUDIO",type:"youtube",url:YT+"COKE_ID"},

 {name:"Discovery",cat:"Documentary",img:"https://via.placeholder.com/300x150/1976d2/fff?text=DISCOVERY",type:"youtube",url:YT+"DISCOVERY_ID"},
];
let cats=["All","Sports","News","Entertainment","Movies","Islamic","Kids","Music","Documentary"];
let cur="All";
let catBox=document.getElementById('cats');
catBox.innerHTML=cats.map(c=>`<button class="${c=='All'?'active':''}" onclick="setCat('${c}',this)">${c}</button>`).join('');
function setCat(c,btn){cur=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function render(){let q=document.getElementById('search').value.toLowerCase();let grid=document.getElementById('grid');grid.innerHTML="";channels.filter(c=>(cur=="All"||c.cat==cur)&&c.name.toLowerCase().includes(q)).forEach(c=>{grid.innerHTML+=`<div class="card" onclick="playChannel('${c.url}','${c.name}','${c.type}')"><img src="${c.img}"><p><span class="live">LIVE</span><br>${c.name}</p></div>`;});}
function playChannel(url,name,type){document.getElementById('playerBox').style.display="flex";document.getElementById('playingName').innerText=name;let v=document.getElementById('video');let f=document.getElementById('ytFrame');if(type=='youtube'){v.style.display='none';v.pause();f.style.display='block';f.src=url}else{f.style.display='none';f.src='';v.style.display='block';if(Hls.isSupported()){let hls=new Hls();hls.loadSource(url);hls.attachMedia(v)}else{v.src=url}}}
function closePlayer(){document.getElementById('playerBox').style.display="none";document.getElementById('video').pause();document.getElementById('ytFrame').src=''}
render();
</script>
</body>
</html>
